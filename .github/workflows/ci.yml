
name: CI - Calculadora

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verificar versões
        run: |
          java -version
          javac -version
          mvn -version

      - name: Executar testes
        run: mvn test

      - name: Gerar JAR
        run: mvn package

      - name: Disponibilizar JAR como artefato
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-jar
          path: target/*.jar
